# Runs on every push and pull request: both backends are tested (the Spring Boot edition on H2 and on
# PostgreSQL), the Docker image is built and started, and the web app is built.
name: CI

on:
  push:
  pull_request:

jobs:
  backend-javalin:
    name: Backend (Javalin) - tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B test

  backend-spring:
    name: Backend (Spring Boot) - tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-spring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B test

  # The same suite again, against a real PostgreSQL: the database the deployed application uses.
  # The migrations in db/migration run there first, exactly as they do in production.
  backend-spring-postgres:
    name: Backend (Spring Boot) - tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: brief_test
          POSTGRES_USER: brief
          POSTGRES_PASSWORD: brief
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brief -d brief_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BRIEF_TEST_DB_URL: jdbc:postgresql://localhost:5432/brief_test
      BRIEF_TEST_DB_USER: brief
      BRIEF_TEST_DB_PASSWORD: brief
    defaults:
      run:
        working-directory: backend-spring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B test

  # Proves the Dockerfile still builds, and that the image starts and answers /health.
  docker-image:
    name: Docker image - build and start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t brief .
      - name: Start the container and wait for /health
        run: |
          docker run -d --name brief -p 8080:8080 brief
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health; then exit 0; fi
            sleep 3
          done
          docker logs brief
          exit 1

  frontend:
    name: Frontend - type-check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
