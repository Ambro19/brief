# Render Blueprint: describes the whole deployment, so it is created the same way every time.
#
# In the Render dashboard: New > Blueprint, choose this repository. Render reads this file and
# creates one web service (built from the Dockerfile) and one PostgreSQL database, connected.
#
# IMPORTANT, learned with 2.4: on a service that already exists, a variable ADDED to this file
# later does not appear on the service by itself. Every new variable is listed in CHANGELOG.md
# under "Before you deploy"; add it in the dashboard (service > Environment) before pushing.
#
# Field names follow https://render.com/docs/blueprint-spec (checked October 11, 2026).
#
# Two variables are not filled in by this file: BRIEF_RESEND_API_KEY, a secret, and
# BRIEF_OWNER_USERNAME, which differs from one deployment to the next (both "sync: false").
# The start-up log says what the application found: the lines "Board:", "Owner:" and "Mail:".

services:
  - type: web
    name: brief
    runtime: docker                 # build the image from the Dockerfile in this repository
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free                      # to try it. Sleeps after 15 idle minutes. Paid: 0.5c-512mb ($7 a month)
    region: virginia                # cannot be changed later. Keep the database in the same region
    healthCheckPath: /health        # Render calls this to know the application is up
    # Deploy a commit only after its checks on GitHub have passed (.github/workflows/ci.yml: both
    # backends' tests, the tests on PostgreSQL, the Docker image, the web app). Until 2.4 this was
    # "commit": every push went live at once, tested or not.
    autoDeployTrigger: checksPass
    envVars:
      # Login tokens and ownership rules on. This is also the default; stated here so it is visible.
      - key: BRIEF_AUTH_MODE
        value: strict
      # The key that signs login tokens. Render makes a random one, once, and keeps it:
      # 256 random bits, written as 44 characters. It never appears in this repository.
      - key: BRIEF_JWT_SECRET
        generateValue: true
      # Requests reach the application through Render's proxy, so the connection's address is
      # the proxy's. This header carries the visitor's own address (see security/ClientAddress.java).
      - key: BRIEF_CLIENT_IP_HEADER
        value: CF-Connecting-IP
      # Where the web app lives. The links in the mails the application sends point here. It is
      # written down, not taken from the request, so nobody can make the application mail a link
      # to another site by asking under another host name.
      - key: BRIEF_PUBLIC_URL
        value: https://briefmessage.net
      # Who the mails come from. The domain must be verified at Resend (three DNS records).
      - key: BRIEF_MAIL_FROM
        value: "Brief! <hello@briefmessage.net>"
      # The key for Resend, the service that delivers the mails. A secret: set it in the dashboard.
      # Without it nothing is sent; each mail is written to the log instead, and the log says so.
      - key: BRIEF_RESEND_API_KEY
        sync: false
      # Closed: creating an account needs an invitation link, and reading needs a sign-in (2.5).
      # "open" lets anyone read and join.
      - key: BRIEF_BOARD
        value: closed
      # The member who runs the board and sends the invitations: the username of an existing
      # account (on briefmessage.net: AmbroLum). Set it in the dashboard.
      - key: BRIEF_OWNER_USERNAME
        sync: false
      # The database, as one connection string on Render's private network. The application
      # turns it into the JDBC settings it needs when it starts (config/DatabaseUrl.java).
      - key: DATABASE_URL
        fromDatabase:
          name: brief-db
          property: connectionString

databases:
  - name: brief-db
    databaseName: brief
    user: brief
    plan: free                      # to try it. EXPIRES 30 days after creation. Paid: 0.1c-256mb ($6 a month)
    region: virginia
    postgresMajorVersion: "16"      # the version the migrations were tested on
    ipAllowList: []                 # reachable from Render's private network only, not from the internet
