# Active only with:  java -jar target/brief-spring.jar --spring.profiles.active=postgres
# These lines override the matching ones in application.properties.
# A ready-made PostgreSQL for development:  docker compose up -d postgres   (see docker-compose.yml)
#
# This profile is for PostgreSQL on your own machine. A deployment on Render does not need it:
# there the DATABASE_URL variable alone selects PostgreSQL (see config/DatabaseUrl.java).
spring.datasource.url=${BRIEF_DB_URL:jdbc:postgresql://localhost:5432/brief}
spring.datasource.username=${BRIEF_DB_USER:brief}
spring.datasource.password=${BRIEF_DB_PASSWORD:brief}

# application.properties lets Flyway adopt a database that has tables but no Flyway history,
# because that is what a database made by Brief! 2.2 looks like. Such a database can only be an
# H2 file: 2.2 never ran on PostgreSQL. So here that allowance is switched off. If this profile
# is ever pointed at a PostgreSQL database that already holds another project's tables, Flyway
# stops at start-up with a clear message, where it would otherwise mark that database as its own.
spring.flyway.baseline-on-migrate=false
