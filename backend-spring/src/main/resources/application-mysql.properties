# Active only with:  java -jar target/brief-spring.jar --spring.profiles.active=mysql
# These lines override the matching ones in application.properties.
# A ready-made MySQL for development:  docker compose up -d mysql   (see docker-compose.yml)
#
# STATUS: a study profile. It has never been run, and it is not the path to production
# (that is PostgreSQL). The migration files in db/migration are written for H2 and PostgreSQL
# and use syntax MySQL does not accept, so on this profile Flyway is switched off and Hibernate
# creates the tables from the entity classes, as every profile did until 2.2. The foreign keys
# added in V2 are therefore not created here. On a MySQL database that already holds accounts
# from 2.2, Hibernate cannot add the new username_key column (it must not be empty, and nothing
# fills it): start this profile on an empty database.
spring.datasource.url=${BRIEF_DB_URL:jdbc:mysql://localhost:3306/brief?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${BRIEF_DB_USER:brief}
spring.datasource.password=${BRIEF_DB_PASSWORD:brief}
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
