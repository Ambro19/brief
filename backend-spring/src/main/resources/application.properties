spring.application.name=brief

# The part after the colon is the default, used when the environment variable is not set.
server.port=${PORT:8080}

# strict = login tokens and ownership enforced, strong passwords, login rate limit (the default).
# compat = the original training contract: no tokens needed. The contract tests use this.
brief.auth.mode=${BRIEF_AUTH_MODE:strict}

# --- Login tokens (JWT) ---
# The key that signs the tokens. Never write a real key in this file: set the environment
# variable BRIEF_JWT_SECRET (32 characters or more). Left empty, the app makes a random key
# at every start, which is fine on your own machine: members just sign in again after a restart.
brief.jwt.secret=${BRIEF_JWT_SECRET:}
# How long a login lasts, in minutes (720 = 12 hours).
brief.jwt.ttl-minutes=${BRIEF_JWT_TTL_MINUTES:720}

# --- Login rate limit (strict mode only) ---
# After this many attempts in a row without a success, for one username from one address,
# logins for that pair are refused with 429 for the lock-out time.
brief.login.max-failures=${BRIEF_LOGIN_MAX_FAILURES:5}
brief.login.lockout-minutes=${BRIEF_LOGIN_LOCKOUT_MINUTES:15}

# --- The visitor's address when the application runs behind a proxy ---
# On a hosting platform every connection arrives from the platform's own proxy, so the address
# of the connection is the same for all visitors. The proxy passes the visitor's address on in a
# request header; name that header here and the login rate limit uses it.
#   Empty (the default): use the address of the connection. Right for your own machine.
#   On Render: CF-Connecting-IP. render.yaml sets it.
# Only name a header that the proxy in front of the application always overwrites. If visitors
# could reach the application directly, they could write the header themselves.
brief.client-ip.header=${BRIEF_CLIENT_IP_HEADER:}
#
# server.forward-headers-strategy is deliberately NOT set. It would also make Spring treat requests
# as HTTPS, and Spring Security would then send the Strict-Transport-Security header, which browsers
# remember for a year. That switch is turned on at the proxy (Cloudflare) when the time comes.

# --- Who may use the board (2.4) ---
# Empty (the default): the board is open. Anyone can read, and anyone can create an account.
# Set to a code of 8 characters or more: the board is closed. Creating an account needs the
# code, and reading needs a sign-in. Never write a real code in this file: set the environment
# variable BRIEF_INVITE_CODE. A closed board needs strict mode; with compat mode the app refuses to start.
brief.invite-code=${BRIEF_INVITE_CODE:}

# --- Email (2.4) ---
# The application mails two kinds of link: "confirm your address" and "choose a new password".
#   BRIEF_RESEND_API_KEY empty (the default): nothing is sent. Each message is written to the
#     log instead, link included, which is all your own machine and the tests need.
#   BRIEF_RESEND_API_KEY set: mail is sent through Resend (resend.com). BRIEF_MAIL_FROM must then
#     name the sender, an address at a domain that is verified in the Resend account, in the form
#     Name <address>. The key is a secret: set it in the environment, never here.
brief.mail.resend-api-key=${BRIEF_RESEND_API_KEY:}
brief.mail.from=${BRIEF_MAIL_FROM:}
# Where Resend is reached. Only the tests change this, to point at a stand-in on the same machine.
brief.mail.resend-url=${BRIEF_RESEND_URL:}
# The address of the web app as members reach it. The links in the mails start with it.
# It is configuration on purpose: a link must never be built from what a request claims its host is.
brief.public-url=${BRIEF_PUBLIC_URL:http://localhost:8080}

# Spring Boot would otherwise create a demo user called "user" and print its password in the log.
# This app has its own accounts table, so that demo user is switched off.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- Database ---
# With nothing set: H2 in a local file, so the app runs with no setup.
# PostgreSQL on your machine:  --spring.profiles.active=postgres  (see application-postgres.properties)
# PostgreSQL on a host that provides DATABASE_URL (Render): nothing to do here. BriefApplication
# reads DATABASE_URL at start-up and fills in the three values below (see config/DatabaseUrl.java).
spring.datasource.url=${BRIEF_DB_URL:jdbc:h2:file:./h2/brief-spring}
spring.datasource.username=${BRIEF_DB_USER:sa}
spring.datasource.password=${BRIEF_DB_PASSWORD:sa}

# --- Schema: Flyway creates and changes it, Hibernate only checks it ---
# Until 2.2 Hibernate created missing tables itself (ddl-auto=update). That leaves no record of
# what changed and cannot do everything a real change needs (fill a new column, add a constraint
# to existing data). Since 2.3 every change is a numbered SQL file in db/migration.
# "validate": at start-up Hibernate compares the entity classes with the tables and refuses to
# start if a mapped table or column is missing or has the wrong type. It never changes anything.
spring.jpa.hibernate.ddl-auto=validate
# A database that was created by 2.2 or earlier has the tables but no Flyway history. With these two
# lines Flyway accepts such a database as "already at version 1" and applies version 2 onward.
# On an empty database they have no effect: every migration runs, starting with V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Do not keep a database session open while the response is being written (Spring warns if this is left on).
spring.jpa.open-in-view=false
